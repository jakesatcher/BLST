name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blst
          POSTGRES_PASSWORD: blst
          POSTGRES_DB: blst_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blst" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://blst:blst@localhost:5432/blst_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
